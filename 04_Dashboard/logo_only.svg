<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Teal Cross Gradient -->
    <linearGradient id="crossTealGrad" x1="46" y1="46" x2="354" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#84D8E5" />
      <stop offset="50%" stop-color="#3E9FB1" />
      <stop offset="100%" stop-color="#1A687A" />
    </linearGradient>

    <!-- Smooth Upper-Right Darker Wave -->
    <linearGradient id="upperWaveGrad" x1="150" y1="46" x2="340" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#145868" />
      <stop offset="100%" stop-color="#257D90" />
    </linearGradient>

    <!-- Smooth Bottom-Left Light Ribbon -->
    <linearGradient id="bottomRibbonGrad" x1="46" y1="210" x2="260" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9BE7F2" />
      <stop offset="100%" stop-color="#3797A9" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="iconShadow" x="20" y="20" width="360" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#051923" flood-opacity="0.22" />
    </filter>

    <!-- Cross Clip Path -->
    <clipPath id="crossClip">
      <path d="M167 46C151.536 46 139 58.536 139 74V139H74C58.536 139 46 151.536 46 167V233C46 248.464 58.536 261 74 261H139V326C139 341.464 151.536 354 167 354H233C248.464 354 261 341.464 261 326V261H326C341.464 261 354 248.464 354 233V167C354 151.536 341.464 139 326 139H261V74C261 58.536 248.464 46 233 46H167Z" />
    </clipPath>
  </defs>

  <g id="AlistoCare-Icon" filter="url(#iconShadow)">
    <!-- 1. White Outer Stroke / Border -->
    <path id="White-Cross-Border" d="M167 40C148.222 40 133 55.2223 133 74V133H74C55.2223 133 40 148.222 40 167V233C40 251.778 55.2223 267 74 267H133V326C133 344.778 148.222 360 167 360H233C251.778 360 267 344.778 267 326V267H326C344.778 267 360 251.778 360 233V167C360 148.222 344.778 133 326 133H267V74C267 55.2223 251.778 40 233 40H167Z" fill="#FFFFFF" />

    <!-- 2. Teal Cross Interior (Seamless Curves) -->
    <g clip-path="url(#crossClip)">
      <rect x="46" y="46" width="308" height="308" fill="url(#crossTealGrad)" />

      <!-- Seamless Upper-Right Dark Wave -->
      <path d="M210 46C165 52 135 92 135 142C135 198 188 238 223 282C258 242 320 232 354 205V46H210Z" fill="url(#upperWaveGrad)" />

      <!-- Seamless Bottom-Left Light Wave -->
      <path d="M46 218C112 212 182 240 218 292C226 304 229 326 225 354H46V218Z" fill="url(#bottomRibbonGrad)" opacity="0.88" />

      <!-- Smooth Bottom-Right Corner Accent -->
      <path d="M223 282C256 242 314 234 354 208V354H223V282Z" fill="#7AD3E1" opacity="0.55" />
    </g>

    <!-- 3. Solid White Mother & Child Silhouette -->
    <g id="White-Mother-And-Child">
      <path d="M235 104C226 114 213 116 199 118C172 122 152 142 152 169C152 194 169 212 190 226C205 236 217 245 223 262C227 247 235 236 247 227C261 216 267 201 264 186C261 170 247 160 232 163C219 166 210 176 211 189C211 194 213 198 216 202C203 197 193 188 188 176C182 162 186 146 198 139C204 135 210 137 214 141C217 144 221 142 222 138C223 134 221 130 224 126C228 121 234 118 235 112C236 109 236 106 235 104Z" fill="#FFFFFF" />
      <path d="M184 129C168 138 160 156 163 175C166 191 178 204 192 213C181 202 173 188 172 172C171 154 176 139 184 129Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>